name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Actualiza fotos y publicaciones de la web de Autonet varias veces por día
  # (hora Argentina: 8:15, 12:15, 16:15 y 20:15)
  schedule:
    - cron: '15 11,15,19,23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Sync Autonet web (fotos y publicaciones)
        continue-on-error: true
        timeout-minutes: 10
        env:
          AUTONET_API_KEY: ${{ secrets.AUTONET_API_KEY }}
          PREVIOUS_CATALOG_URL: ${{ steps.pages.outputs.base_url }}/autonet-web/catalog.json
        run: node scripts/fetchAutonetWeb.mjs

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Verify Official Template PDFs Integrity
        run: |
          IRUNA_HASH="47e5a41c031739c6097a465c671d51b1f0ffac56987fb0297daa4e541c1fcaf3"
          MIRAGE_HASH="8fc91b44b9dafd0ea75b8987f1ac19d66550278d01a642ea61a769ae952b859f"
          OIL_BULL_HASH="cbc05697ee1c8a6c5059dae60a2754852b8160c6d039eebf2240a61ad3277e16"

          echo "Verificando presencia y hashes en dist/templates/..."
          sha256sum dist/templates/ORIGINAL_*.pdf

          test "$(sha256sum dist/templates/ORIGINAL_IRUNA.pdf | cut -d ' ' -f1)" = "$IRUNA_HASH" || { echo "IRUNA SHA mismatch"; exit 1; }
          test "$(sha256sum dist/templates/ORIGINAL_MIRAGE.pdf | cut -d ' ' -f1)" = "$MIRAGE_HASH" || { echo "MIRAGE SHA mismatch"; exit 1; }
          test "$(sha256sum dist/templates/ORIGINAL_OIL_BULL.pdf | cut -d ' ' -f1)" = "$OIL_BULL_HASH" || { echo "OIL_BULL SHA mismatch"; exit 1; }
          echo "Todos los PDFs oficiales en dist fueron verificados con éxito."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
